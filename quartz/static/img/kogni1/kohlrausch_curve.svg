<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="auto" style="background:#f9f8f6; border-radius:8px; font-family: 'Source Serif 4', Georgia, serif;">
  <!-- Axes -->
  <line x1="80" y1="40" x2="80" y2="280" stroke="#4a433a" stroke-width="2"/>
  <line x1="80" y1="280" x2="550" y2="280" stroke="#4a433a" stroke-width="2"/>
  <!-- Axis Labels -->
  <text x="280" y="320" font-size="14" fill="#2b2826" text-anchor="middle" font-weight="bold">Karanlıkta Geçen Süre (Dakika)</text>
  <text x="30" y="160" font-size="14" fill="#2b2826" text-anchor="middle" transform="rotate(-90 30,160)" font-weight="bold">Işık Eşiği (Log Duyarlılık)</text>
  <!-- Time Marks -->
  <text x="80" y="298" font-size="12" fill="#5a5346" text-anchor="middle">0</text>
  <text x="180" y="298" font-size="12" fill="#5a5346" text-anchor="middle">5</text>
  <text x="240" y="298" font-size="12" fill="#C8102E" font-weight="bold" text-anchor="middle">7 (Kırılma)</text>
  <text x="320" y="298" font-size="12" fill="#5a5346" text-anchor="middle">15</text>
  <text x="440" y="298" font-size="12" fill="#5a5346" text-anchor="middle">25</text>
  <text x="520" y="298" font-size="12" fill="#5a5346" text-anchor="middle">35</text>
  <!-- Grid Lines -->
  <line x1="240" y1="40" x2="240" y2="280" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Cone Curve (Fast adapt, plateaus at ~7 min) -->
  <path d="M 80 70 Q 140 160 240 165 L 520 165" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3,3"/>
  <text x="430" y="155" font-size="12" fill="#e07a5f" font-weight="bold">Koniler (Maksimum 7 dk)</text>
  <!-- Rod Curve (Takes over at 7 min, drops threshold drastically) -->
  <path d="M 80 70 Q 140 160 240 165 Q 320 220 520 250" fill="none" stroke="#2a6b5a" stroke-width="3"/>
  <text x="380" y="240" font-size="13" fill="#2a6b5a" font-weight="bold">Karanlık Adaptasyon Eğrisi (Çubuklar)</text>
  <!-- Kohlrausch Break Point Highlight -->
  <circle cx="240" cy="165" r="6" fill="#C8102E"/>
  <text x="248" y="145" font-size="12" fill="#C8102E" font-weight="bold">Kohlrausch Kırılması (7. dk)</text>
</svg>