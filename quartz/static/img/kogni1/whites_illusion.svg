<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="100%" height="auto" style="background:#fff; border-radius:8px;">
  <rect width="540" height="400" fill="#ffffff"/>
  <!-- Black stripes -->
  <g fill="#1a1712">
    <rect x="30" y="20" width="480" height="35"/>
    <rect x="30" y="90" width="480" height="35"/>
    <rect x="30" y="160" width="480" height="35"/>
    <rect x="30" y="230" width="480" height="35"/>
    <rect x="30" y="300" width="480" height="35"/>
  </g>
  <!-- Gray Bars Left (on black background) -->
  <g fill="#888888">
    <rect x="120" y="20" width="60" height="35"/>
    <rect x="120" y="90" width="60" height="35"/>
    <rect x="120" y="160" width="60" height="35"/>
    <rect x="120" y="230" width="60" height="35"/>
    <rect x="120" y="300" width="60" height="35"/>
  </g>
  <text x="140" y="375" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1712">A (Daha Açık?)</text>
  <!-- Gray Bars Right (on white background) -->
  <g fill="#888888">
    <rect x="340" y="55" width="60" height="35"/>
    <rect x="340" y="125" width="60" height="35"/>
    <rect x="340" y="195" width="60" height="35"/>
    <rect x="340" y="265" width="60" height="35"/>
  </g>
  <text x="350" y="375" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1712">B (Daha Koyu?)</text>
</svg>