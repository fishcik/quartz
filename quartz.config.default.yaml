# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: SAYKO.ch
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: tr-TR
  baseUrl: sayko.ch
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Playfair Display
      body: Source Serif 4
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f9f8f6"
        lightgray: "#ece8e1"
        gray: "#b5aea2"
        darkgray: "#4a433a"
        dark: "#2b2826"
        secondary: "#6b4a2f"
        tertiary: "#8a6240"
        highlight: rgba(107, 74, 47, 0.08)
        textHighlight: "#d9b96a55"
      darkMode:
        light: "#1a1712"
        lightgray: "#2a2620"
        gray: "#5a5346"
        darkgray: "#d8cfc0"
        dark: "#f3ece0"
        secondary: "#c79a6d"
        tertiary: "#b07a4a"
        highlight: rgba(199, 154, 109, 0.10)
        textHighlight: "#c79a6d55"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 8
      condition: not-index
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # Görev 1.1: Explorer kaldırıldı — müfredat grid'i + folder sayfaları yerini aldı
  - source: github:quartz-community/explorer
    enabled: false
    options:
      title: İçerik
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 90
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: beforeBody
      priority: 1
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
      condition: not-index
  # Görev 1.7/2.1b: Darkmode sağ sütun en üstte (saatin yanı hizasında)
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: right
      priority: 5
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: ./local-plugins/footer
    enabled: true
    options:
      links: {}
  # Görev 1.4b: Sol sütun "Son Yazılar" accordion (JS ile <details>'e sarılır)
  # limit yüksek: JS folder-index sayfalarını eler, gerçek yazılar yüzeye çıkar
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      title: Son Yazılar
      limit: 18
      showTags: false
    layout:
      position: left
      priority: 40
      condition: not-index
  # Görev 1.4a: Anasayfa son yazılar (JS folder-index'leri eler → ilk 3 hiyerarşi)
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      title: Son Eklenenler
      limit: 18
      linkToMore: tags
      showTags: false
    layout:
      position: afterBody
      priority: 20
      condition: index
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    # Görev 1.7: folder (ders index) sağ sütun korunur (darkmode + graph);
    # sol sütunda TOC ve backlinks gizli — sadece "Son Yazılar" accordion kalır
    folder:
      exclude:
        - reader-mode
        - content-meta
        - table-of-contents
        - backlinks
    tag:
      exclude:
        - reader-mode
        - content-meta
        - table-of-contents
      positions:
        right: []
    canvas: {}
    bases: {}
